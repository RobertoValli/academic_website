{{/* The ?v= fingerprint changes whenever custom.css changes, so browsers
     never keep showing an old copy of the stylesheet. */}}
<link rel="stylesheet" href="/css/custom.css?v={{ substr (readFile "static/css/custom.css" | md5) 0 8 }}">

{{/* Google Analytics 4 tag. Skipped on the local preview server so your own
     visits while editing aren't counted. */}}
{{ if not site.IsServer }}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-W5TKNTV7MT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-W5TKNTV7MT');
</script>
{{ end }}
